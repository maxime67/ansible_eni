---
- name: TP1 - Configuration de base
  hosts: all
  become: true

  vars:
    app_user: webdev
    app_dir: /opt/app
    motd_message: "Serveur géré par Ansible"

  tasks:
    - name: Installer les paquets
      ansible.builtin.apt:
        name:
          - curl
          - vim
          - git
        update_cache: true
        state: present

    - name: Créer un utilisateur applicatif
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Créer le répertoire de l'application
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
        state: directory

    - name: Déployer le fichier de config depuis un template
      ansible.builtin.template:
        src: config.j2
        dest: "{{ app_dir }}/config.ini"
        owner: "{{ app_user }}"
        mode: "0644"

    - name: Écrire le MOTD
      ansible.builtin.copy:
        content: "{{ motd_message }} — {{ inventory_hostname }}\n"
        dest: /etc/motd

    - name: Vérifier que le fichier de config est présent
      ansible.builtin.stat:
        path: "{{ app_dir }}/config.ini"
      register: config_file

    - name: Afficher le résultat
      ansible.builtin.debug:
        msg: "config.ini présent : {{ config_file.stat.exists }}, taille : {{ config_file.stat.size }} octets"
